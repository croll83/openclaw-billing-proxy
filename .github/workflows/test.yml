name: Test video extension
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          npm ci --no-audit --no-fund
      - name: Transport, management and real video tests
        run: VIDEO_TEST_FFMPEG=/usr/bin/ffmpeg VIDEO_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf npm test
      - name: Build and verify read-only container
        run: |
          docker build --tag ai-engine-proxy:video-check .
          python3 tests/container-smoke.py ai-engine-proxy:video-check
